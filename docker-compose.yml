services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kroeng_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - vendor_data:/var/www/html/vendor
      - storage_data:/var/www/html/storage
      - bootstrap_cache_data:/var/www/html/bootstrap/cache
    env_file:
      - .env
    environment:
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy
    networks:
      - kroeng_net

  nginx:
    image: nginx:stable-alpine
    container_name: kroeng_nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - ./:/var/www/html:ro
      - vendor_data:/var/www/html/vendor:ro
      - storage_data:/var/www/html/storage:ro
      - ./docker/nginx/app.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - kroeng_net

  db:
    image: mysql:8.0
    container_name: kroeng_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    ports:
      # Host port changed to 3309 to avoid clashing with Laragon's MySQL already using 3308.
      # This mapping is only for optional host-side DB tools (e.g. HeidiSQL/TablePlus); the
      # app container always talks to MySQL internally via "db:3306", regardless of this line.
      # Safe to remove entirely once you no longer need host access to this DB.
      - "3309:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - kroeng_net

volumes:
  db_data:
  vendor_data:
  storage_data:
  bootstrap_cache_data:

networks:
  kroeng_net:
    driver: bridge
