server {
    listen 80;
    server_name api.kroeng.shop;

    # Send everything to HTTPS (certbot renewals use the --pre/--post-hook
    # stop/start approach below, so this plain redirect is all we need here).
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.kroeng.shop;

    ssl_certificate     /etc/letsencrypt/live/api.kroeng.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.kroeng.shop/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /var/www/html/public;
    index index.php index.html;

    client_max_body_size 25M;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    access_log /var/log/nginx/app-access.log;
    error_log  /var/log/nginx/app-error.log;
}

